repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: verificar
        name: Verificar repositório
        entry: uv run python scripts/manutencao.py verificar
        language: system
        pass_filenames: false
