name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Verify registry versions match tag
        run: jq -e --arg v "${GITHUB_REF_NAME#v}" '.version == $v and all(.packages[]; .version == $v)' server.json
      - name: Verify tag matches package version
        run: test -f "dist/tiss-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tiss
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0/servers?search=health.voa/tiss
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.2
          MCP_PUBLISHER_SHA256: d0554112d8f7affad9a10041776d63129a60b163c05036ae26caf73ecbbd89c8
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          printf '%s  mcp-publisher.tar.gz\n' "$MCP_PUBLISHER_SHA256" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait for PyPI release
        run: |
          for i in $(seq 30); do
            curl --fail --silent "https://pypi.org/pypi/tiss/${GITHUB_REF_NAME#v}/json" -o /dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Authenticate with DNS
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain voa.health --private-key "$MCP_REGISTRY_PRIVATE_KEY"
      - run: ./mcp-publisher publish
